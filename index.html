<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣漫遊地圖 - 全台景點、歷史文物、老街與夜市完整指南</title>
  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --accent: #f59e0b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .filter-panel {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 240px;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .btn {
      padding: 10px 18px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background: var(--primary-dark);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-accent {
      background: var(--accent);
    }
    .btn-accent:hover {
      background: #d97706;
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .filter-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.9rem;
    }

    .filter-label {
      font-weight: bold;
      color: var(--text-muted);
      min-width: 45px;
    }

    .pill-btn {
      padding: 6px 14px;
      border-radius: 20px;
      background: #f1f5f9;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .pill-btn:hover {
      background: #e2e8f0;
    }

    .pill-btn.active {
      background: var(--primary);
      color: white;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .spot-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .spot-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    .spot-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .spot-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
    }

    .fav-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: #cbd5e1;
      transition: color 0.2s;
    }

    .fav-btn.active {
      color: #ef4444;
    }

    .spot-meta {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .meta-tag {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: #f1f5f9;
      color: #475569;
    }

    .meta-tag.region {
      background: #dbeafe;
      color: #1e40af;
      font-weight: 600;
    }

    .spot-desc {
      font-size: 0.9rem;
      color: #475569;
      margin-bottom: 16px;
      flex-grow: 1;
    }

    .spot-footer {
      display: flex;
      justify-content: flex-end;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .spot-footer a {
      font-size: 0.85rem;
      color: var(--primary-dark);
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .spot-footer a:hover {
      text-decoration: underline;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      animation: pop 0.25s ease-out;
    }

    @keyframes pop {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .empty-state {
      text-align: center;
      grid-column: 1 / -1;
      padding: 60px 0;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🧭 台灣漫遊地圖</h1>
      <p>探索全台精選私房景點、知名老街與夜市美食！</p>
    </header>

    <div class="filter-panel">
      <div class="search-row">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜尋綠島、高雄夜市、老街、古蹟或關鍵字...">
        <button class="btn btn-accent" id="randomBtn">🎲 幫我選！隨機推薦</button>
        <button class="btn btn-outline" id="favFilterBtn">❤️ 我的口袋名單 (<span id="favCount">0</span>)</button>
      </div>

      <!-- 第一層地區 -->
      <div class="filter-group">
        <span class="filter-label">地區：</span>
        <button class="pill-btn active" data-region="all">全部地區</button>
        <button class="pill-btn" data-region="北部">北部</button>
        <button class="pill-btn" data-region="中部">中部</button>
        <button class="pill-btn" data-region="南部">南部</button>
        <button class="pill-btn" data-region="東部">東部</button>
        <button class="pill-btn" data-region="離島">離島</button>
      </div>

      <!-- 第二層縣市（綠島、蘭嶼、小琉球獨立） -->
      <div class="filter-group" id="cityGroupWrapper">
        <span class="filter-label">縣市：</span>
        <div id="cityContainer" style="display: inline-flex; flex-wrap: wrap; gap: 8px;"></div>
      </div>

      <!-- 主題篩選 -->
      <div class="filter-group">
        <span class="filter-label">主題：</span>
        <button class="pill-btn active" data-category="all">全部主題</button>
        <button class="pill-btn" data-category="文化歷史">文化歷史</button>
        <button class="pill-btn" data-category="夜市美食">夜市美食</button>
        <button class="pill-btn" data-category="老街市集">老街市集</button>
        <button class="pill-btn" data-category="自然風景">自然風景</button>
      </div>
    </div>

    <div class="stats-bar">
      <span>目前顯示景點：<strong id="displayCount">0</strong> 個</span>
      <span id="activeFilterDesc">全部景點</span>
    </div>

    <div class="cards-grid" id="cardsGrid"></div>
  </div>

  <div class="modal" id="randomModal">
    <div class="modal-content">
      <div style="font-size: 2.5rem; margin-bottom: 12px;">🎉</div>
      <h3 style="color: var(--text-muted); font-size: 0.95rem;">本週推薦你的好去處</h3>
      <h2 id="modalSpotName" style="color: var(--primary-dark); margin: 8px 0 16px; font-size: 1.6rem;"></h2>
      <p id="modalSpotDesc" style="color: #475569; font-size: 0.95rem; margin-bottom: 24px; line-height: 1.6;"></p>
      <div style="display: flex; gap: 8px; justify-content: center;">
        <a id="modalMapLink" href="#" target="_blank" class="btn" style="text-decoration: none;">📍 Google 地圖</a>
        <button class="btn btn-outline" id="closeModalBtn">關閉</button>
      </div>
    </div>
  </div>

      { id: 212, name: "彰化扇形車庫", region: "中部", city: "彰化縣", category: "文化歷史", desc: "全台僅存唯一運作中的扇形火車頭庫房，被譽為國寶級鐵道文化活古蹟。" },
      { id: 213, name: "鹿港龍山寺", region: "中部", city: "彰化縣", category: "文化歷史", desc: "國定古蹟，有台灣紫禁城美譽，八卦藻井木雕結構全以榫卯接合。" },

      { id: 214, name: "草鞋墩人文觀光夜市", region: "中部", city: "南投縣", category: "夜市美食", desc: "南投草屯週五六日大型夜市，阿里山鐵道紅茶、烤山豬肉香腸與蚵仔煎。" },
      { id: 215, name: "車埕老街聚落", region: "中部", city: "南投縣", category: "老街市集", desc: "依山傍水的最後火車站，山林圍繞的隱密林業小鎮，品嚐木桶便當與手工木工。" },
      { id: 216, name: "水里蛇窯陶藝文化園區", region: "中部", city: "南投縣", category: "文化歷史", desc: "全台最古老柴燒木柴蛇窯，長達數十公尺如長蛇盤踞，傳承台灣傳統製陶工藝。" },

      { id: 218, name: "日月潭水社壩", region: "中部", city: "南投縣", category: "自然風景", desc: "全球最美自行車道之一，平靜如鏡的湖光山色令人心曠神怡。" },
      { id: 219, name: "清境農場青青草原", region: "中部", city: "南投縣", category: "自然風景", desc: "綿延翠綠的高山草原、綿羊秀與壯闊的合歡山群峰視野。" },

      { id: 220, name: "南庄老街桂花巷", region: "中部", city: "苗栗縣", category: "老街市集", desc: "古色古香客家聚落，品嚐桂花釀冰鎮湯圓、客家米食麻糬與丈母娘豆干。" },
      { id: 221, name: "勝興車站與魚藤坪斷橋", region: "中部", city: "苗栗縣", category: "文化歷史", desc: "舊山線海拔最高點百年木造火車站，糯米砌成斷橋紅磚屹立不搖展現鐵道工藝。" },
      { id: 222, name: "後龍好望角", region: "中部", city: "苗栗縣", category: "自然風景", desc: "站在高聳海邊台地俯瞰白色大風車、海線鐵道奔馳與夕陽海岸線。" },

      { id: 223, name: "斗六人文夜市", region: "中部", city: "雲林縣", category: "夜市美食", desc: "雲林最大夜市，佔地寬廣攤位數百家，雅淳水果茶、現烤披薩與炭烤大雞排。" },
      { id: 224, name: "虎尾夜市（拜五街）", region: "中部", city: "雲林縣", category: "夜市美食", desc: "雲林虎尾週五最熱鬧夜市，拔絲地瓜、麻辣魚蛋、現切水果與烤玉米名攤。" },
      { id: 225, name: "西螺延平老街", region: "中部", city: "雲林縣", category: "老街市集", desc: "保留完整裝飾藝術風（Art Deco）街屋，老牌黑豆醬油工廠與西螺麻糬飄香。" },
      { id: 226, name: "北港中山路老街", region: "中部", city: "雲林縣", category: "老街市集", desc: "朝天宮前熱鬧古街，販售北港傳統大餅、手工麻油、花生酥與在地鴨肉羹。" },
      { id: 227, name: "北港朝天宮", region: "中部", city: "雲林縣", category: "文化歷史", desc: "國定古蹟，台灣媽祖信仰中心，廟內石雕木雕由清代名匠精雕細琢。" },

      // ════════════════════ 東部地區 (花蓮、台東) ════════════════════
      { id: 231, name: "東大門國際觀光夜市", region: "東部", city: "花蓮縣", category: "夜市美食", desc: "東台灣最大夜市，匯聚原住民一條街、福町夜市與各省一條街，烤飛魚強蛋餅必吃。" },
      { id: 232, name: "花蓮文化創意老街坊", region: "東部", city: "花蓮縣", category: "老街市集", desc: "百年舊酒廠日式黑瓦房舍群，週末舉辦手作市集、文創小店與獨立展演聚落。" },
      { id: 233, name: "吉安慶修院", region: "東部", city: "花蓮縣", category: "文化歷史", desc: "台灣保存最完整的日式真言宗寺院古蹟，江戶風格木造佛堂充滿靜謐禪意。" },
      { id: 234, name: "林田山林業文化園區", region: "東部", city: "花蓮縣", category: "文化歷史", desc: "昔日東台灣第四大林場「小摩里沙卡」，完整保存日式檜木建築聚落與運材鐵道。" },
      { id: 235, name: "七星潭風景區", region: "東部", city: "花蓮縣", category: "自然風景", desc: "美麗的新月形礫石海灣，聽著浪花拍打鵝卵石的療癒聲音放空。" },
      { id: 236, name: "太魯閣燕子口", region: "東部", city: "花蓮縣", category: "自然風景", desc: "舉世聞名的大理石峽谷鬼斧神工地形，臨場感壯觀無比。" },

      { id: 237, name: "台東觀光夜市（正氣路）", region: "東部", city: "台東縣", category: "夜市美食", desc: "四、五、六正氣路封街夜市，派克脆皮雞排、烤肉刈包、東山鴨頭與釋迦冰淇淋。" },
      { id: 238, name: "四維路夜市", region: "東部", city: "台東縣", category: "夜市美食", desc: "台東週日限定大型傳統流動夜市，在地鄉親採買小吃、套圈圈童玩勝地。" },
      { id: 239, name: "關山老街", region: "東部", city: "台東縣", category: "老街市集", desc: "日治時期棋盤式街道規劃，保留百年木造站房、嘉賓旅社與在地傳統花生酥老舖。" },
      { id: 240, name: "成功老街新港漁港", region: "東部", city: "台東縣", category: "老街市集", desc: "東海岸最大漁港街區，觀賞熱鬧拍賣旗魚、品嚐現切生魚片與海產海味。" },
      { id: 241, name: "國立臺灣史前文化博物館", region: "東部", city: "台東縣", category: "文化歷史", desc: "全台首座國家級考古與南島語族文化博物館，展出卑南遺址出土珍貴玉器陶器。" },
      { id: 242, name: "伯朗大道", region: "東部", city: "台東縣", category: "自然風景", desc: "一望無際的稻浪鄉間道路，騎單車馳騁於無電線桿的綠色天堂中。" },
      { id: 243, name: "三仙台跨海步橋", region: "東部", city: "台東縣", category: "自然風景", desc: "八拱跨海波浪大橋連接離島岬角，是全台迎第一道曙光的指標景點。" }
    ];

    let currentRegion = "all";
    let currentCity = "all";
    let currentCategory = "all";
    let searchQuery = "";
    let showFavoritesOnly = false;
    let favorites = JSON.parse(localStorage.getItem("taiwan_travel_favs")) || [];

    const cardsGrid = document.getElementById("cardsGrid");
    const searchInput = document.getElementById("searchInput");
    const randomBtn = document.getElementById("randomBtn");
    const favFilterBtn = document.getElementById("favFilterBtn");
    const favCountSpan = document.getElementById("favCount");
    const displayCountSpan = document.getElementById("displayCount");
    const activeFilterDesc = document.getElementById("activeFilterDesc");
    const cityContainer = document.getElementById("cityContainer");
    const cityGroupWrapper = document.getElementById("cityGroupWrapper");
    const randomModal = document.getElementById("randomModal");
    const modalSpotName = document.getElementById("modalSpotName");
    const modalSpotDesc = document.getElementById("modalSpotDesc");
    const modalMapLink = document.getElementById("modalMapLink");
    const closeModalBtn = document.getElementById("closeModalBtn");

    function updateCityButtons() {
      if (currentRegion === "all") {
        cityGroupWrapper.style.display = "none";
        currentCity = "all";
        return;
      }

      cityGroupWrapper.style.display = "flex";
      const cities = REGION_CITIES[currentRegion] || [];
      
      let html = `<button class="pill-btn ${currentCity === 'all' ? 'active' : ''}" data-city="all">全${currentRegion}</button>`;
      cities.forEach(city => {
        html += `<button class="pill-btn ${currentCity === city ? 'active' : ''}" data-city="${city}">${city}</button>`;
      });
      cityContainer.innerHTML = html;

      cityContainer.querySelectorAll('[data-city]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          cityContainer.querySelectorAll('[data-city]').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentCity = e.target.getAttribute('data-city');
          renderCards();
        });
      });
    }

    function getFilteredSpots() {
      return SPOTS_DATA.filter(spot => {
        const matchRegion = currentRegion === "all" || spot.region === currentRegion;
        const matchCity = currentCity === "all" || spot.city === currentCity;
        const matchCategory = currentCategory === "all" || spot.category === currentCategory;
        const matchSearch = spot.name.includes(searchQuery) || 
                            spot.city.includes(searchQuery) || 
                            spot.desc.includes(searchQuery);
        const matchFav = !showFavoritesOnly || favorites.includes(spot.id);
        return matchRegion && matchCity && matchCategory && matchSearch && matchFav;
      });
    }

    function renderCards() {
      const filtered = getFilteredSpots();
      displayCountSpan.textContent = filtered.length;
      favCountSpan.textContent = favorites.length;

      let desc = currentRegion === "all" ? "全部地區" : currentRegion;
      if (currentCity !== "all") desc += ` ➜ ${currentCity}`;
      if (currentCategory !== "all") desc += ` ➜ ${currentCategory}`;
      if (showFavoritesOnly) desc += ` ➜ ❤️ 已收藏`;
      activeFilterDesc.textContent = desc;

      if (filtered.length === 0) {
        cardsGrid.innerHTML = `
          <div class="empty-state">
            <p style="font-size: 2rem;">🏮</p>
            <p>沒有找到符合條件的景點、夜市或老街，換個關鍵字搜尋看看吧！</p>
          </div>
        `;
        return;
      }

      cardsGrid.innerHTML = filtered.map(spot => {
        const isFav = favorites.includes(spot.id);
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spot.city + ' ' + spot.name)}`;
        return `
          <div class="spot-card">
            <div>
              <div class="spot-header">
                <div class="spot-name">${spot.name}</div>
                <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite(${spot.id})" title="加入口袋名單">
                  ${isFav ? '❤️' : '🤍'}
                </button>
              </div>
              <div class="spot-meta">
                <span class="meta-tag region">${spot.region} · ${spot.city}</span>
                <span class="meta-tag">${spot.category}</span>
              </div>
              <div class="spot-desc">${spot.desc}</div>
            </div>
            <div class="spot-footer">
              <a href="${mapUrl}" target="_blank" rel="noopener noreferrer">
                在 Google 地圖中查看 ↗
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    window.toggleFavorite = function(id) {
      if (favorites.includes(id)) {
        favorites = favorites.filter(favId => favId !== id);
      } else {
        favorites.push(id);
      }
      localStorage.setItem("taiwan_travel_favs", JSON.stringify(favorites));
      renderCards();
    };

    document.querySelectorAll('[data-region]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('[data-region]').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentRegion = e.target.getAttribute('data-region');
        currentCity = "all";
        updateCityButtons();
        renderCards();
      });
    });

    document.querySelectorAll('[data-category]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('[data-category]').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentCategory = e.target.getAttribute('data-category');
        renderCards();
      });
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderCards();
    });

    favFilterBtn.addEventListener('click', () => {
      showFavoritesOnly = !showFavoritesOnly;
      favFilterBtn.classList.toggle('active', showFavoritesOnly);
      favFilterBtn.style.background = showFavoritesOnly ? '#ef4444' : '';
      favFilterBtn.style.color = showFavoritesOnly ? 'white' : '';
      renderCards();
    });

    randomBtn.addEventListener('click', () => {
      const candidates = getFilteredSpots();
      if (candidates.length === 0) {
        alert("目前篩選條件下沒有景點可以抽取喔！");
        return;
      }
      const randomSpot = candidates[Math.floor(Math.random() * candidates.length)];
      modalSpotName.textContent = `${randomSpot.city} · ${randomSpot.name}`;
      modalSpotDesc.textContent = randomSpot.desc;
      modalMapLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(randomSpot.city + ' ' + randomSpot.name)}`;
      randomModal.style.display = "flex";
    });

    closeModalBtn.addEventListener('click', () => {
      randomModal.style.display = "none";
    });

    updateCityButtons();
    renderCards();
  </script>
</body>
</html>
